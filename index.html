<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal de aprendices | SENA</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <main class="contenedor">
      <header>
        <span class="marca">SENA</span>
        <p>Proyecto académico · ADSO</p>
      </header>
      <center> <nav class="navbar-form"><a href="/">Registro</a> | <a href="/dashboard">Dashboard</a> |<a href="/aprendices">Aprendices</a></nav> </center>
      <h1>Visca Barca Visca Cataluña</h1>
      <p>Siempre Cule</p>
      
      <form method="POST" action="/">
        <label for="nombre">Nombre completo</label>
        <input
          id="nombre"
          name="nombre"
          type="text"
          placeholder="Escribe tu nombre"
          required
        />
        <label for="ficha">Número de ficha</label>
        <input
          id="ficha"
          name="ficha"
          type="text"
          placeholder="Ej. 3484008"
          required
        />
        <label for="programa">Programa de formación</label>
        <input
          id="programa"
          name="programa"
          type="text"
          placeholder="Ej. ADSO"
          required
        />
        <label for="jornada">Jornada</label>
        <select id="jornada" name="jornada" required>
          <option value="" disabled selected>Selecciona tu jornada</option>
          <option value="Mañana">Mañana</option>
          <option value="Tarde">Tarde</option>
          <option value="Noche">Noche</option>
        </select>
        <label for="correo">Correo electronico</label>
        <input
          id="correo"
          name="correo"
          type="email"
          placeholder="Ej. johanurbina@gmail.com"
          required
        />
        <label for="ciudad">Ciudad de residencia</label>
        <input
          id="ciudad"
          name="ciudad"
          type="text"
          placeholder="Ej. Medellín"
          required
        />
        <label for="Direccion">Direccion</label>
        <input
          id="Direccion"
          name="Direccion"
          type="text"
          placeholder="Ej. Carrera 15c #78-89"
          required
        />
      
        <button type="submit">Validar registro</button>
      </form>
      {% if mensaje %}
      <p class="exito" role="status">{{ mensaje }}</p>
      {% endif %} {% if error %}
      <p class="error" role="alert">{{ error }}</p>
      {% endif %}
      <footer>
        Infiel a mi Mujer, pero nunca al Barca
      </footer>
    </main>
  </body>
</html>
